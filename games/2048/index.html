<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2048 · Game Arcade</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/arcade.css" />
  </head>
  <body>
    <header class="site-header"><a class="brand" href="../../index.html"><span class="brand-mark">▶</span><span>Game Arcade</span></a><a class="nav-link" href="../../index.html">← Dashboard</a></header>
    <main class="arcade-main">
      <div class="arcade-heading"><div><h1>2048</h1><p>Combine matching tiles to reach 2048.</p></div></div>
      <section class="arcade-layout"><div class="arcade-panel">
        <div class="arcade-toolbar"><div class="arcade-stats"><span>Score <strong id="score">0</strong></span><span>Best <strong id="best">0</strong></span></div><button class="arcade-button arcade-button-primary" id="restart" type="button">New game</button></div>
        <div class="number-board" id="board" aria-label="2048 game board"></div><p class="status-message" id="status" aria-live="polite"></p>
      </div><p class="arcade-help">Use arrow keys, swipe, or WASD to slide the tiles.</p></section>
    </main>
    <script src="2048.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic-Tac-Toe · Game Arcade</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/arcade.css" />
  </head>
  <body>
    <header class="site-header"><a class="brand" href="../../index.html"><span class="brand-mark">▶</span><span>Game Arcade</span></a><a class="nav-link" href="../../index.html">← Dashboard</a></header>
    <main class="arcade-main">
      <div class="arcade-heading"><div><h1>Tic-Tac-Toe</h1><p>Play X against the computer.</p></div></div>
      <section class="arcade-layout"><div class="arcade-panel">
        <div class="arcade-toolbar"><div class="arcade-stats"><span>Turn <strong id="turn">X</strong></span></div><button class="arcade-button arcade-button-primary" id="restart" type="button">New game</button></div>
        <div class="ttt-board" id="board" aria-label="Tic-Tac-Toe board"></div><p class="status-message" id="status" aria-live="polite">Your turn</p>
      </div><p class="arcade-help">Choose any square. The computer plays O.</p></section>
    </main>
    <script src="tic-tac-toe.js"></script>
  </body>
</html>

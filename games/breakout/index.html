<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breakout · Game Arcade</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/arcade.css" />
  </head>
  <body>
    <header class="site-header"><a class="brand" href="../../index.html"><span class="brand-mark">▶</span><span>Game Arcade</span></a><a class="nav-link" href="../../index.html">← Dashboard</a></header>
    <main class="arcade-main">
      <div class="arcade-heading"><div><h1>Breakout</h1><p>Clear the bricks and keep the ball in play.</p></div></div>
      <section class="arcade-layout"><div class="arcade-panel">
        <div class="arcade-toolbar"><div class="arcade-stats"><span>Score <strong id="score">0</strong></span><span>Lives <strong id="lives">3</strong></span></div><button class="arcade-button arcade-button-primary" id="start" type="button">Start game</button></div>
        <canvas class="arcade-canvas" id="game" width="480" height="420" aria-label="Breakout game"></canvas>
      </div><p class="arcade-help">Move with ← → or A/D. Move the mouse or finger over the board to steer.</p></section>
    </main>
    <script src="breakout.js"></script>
  </body>
</html>

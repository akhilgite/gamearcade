<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Match · Game Arcade</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/arcade.css" />
  </head>
  <body>
    <header class="site-header"><a class="brand" href="../../index.html"><span class="brand-mark">▶</span><span>Game Arcade</span></a><a class="nav-link" href="../../index.html">← Dashboard</a></header>
    <main class="arcade-main">
      <div class="arcade-heading"><div><h1>Memory Match</h1><p>Find all eight pairs with as few turns as possible.</p></div></div>
      <section class="arcade-layout"><div class="arcade-panel">
        <div class="arcade-toolbar"><div class="arcade-stats"><span>Moves <strong id="moves">0</strong></span><span>Pairs <strong id="pairs">0/8</strong></span></div><button class="arcade-button arcade-button-primary" id="restart" type="button">New game</button></div>
        <div class="memory-board" id="board" aria-label="Memory cards"></div><p class="status-message" id="status" aria-live="polite"></p>
      </div></section>
    </main>
    <script src="memory.js"></script>
  </body>
</html>
